<div class="flex flex-col items-center justify-center bg-gray-700/30 relative w-screen h-[90dvh]">
  <div class="max-w-md bg-white/70 backdrop-blur-md p-6 rounded-2xl shadow-lg">
    @if(otpStatus()){<button class="absolute top-2 left-3" (click)="handleBack()">
      <lucide-angular [img]="LeftArrow" class="w-4 h-4 text-gray-800" /></button
    >}
    <!-- Form Body -->
    <div>
      <h1 class="text-2xl font-semibold text-center text-gray-800 mb-6">Sign Up</h1>
      <img src="/images/profile.png" alt="" class="w-20 h-20 mx-auto mb-4 rounded-full" />
    </div>
    <div class="mb-6">
      @if (signupMethod() === 'email') {
      <app-emailform
        mode="signup"
        (otpSend)="handleOtpStatus($event)"
        [otpMode]="otpStatus"
      ></app-emailform>
      } @else {
      <!-- Mobile Signup -->
      <app-mobileform (otpSend)="handleOtpStatus($event)" [otpMode]="otpStatus"></app-mobileform>
      }
    </div>

    @if(!otpStatus()) {
    <!-- Footer -->
    <div class="flex justify-center space-x-4 mb-4">
      @if (signupMethod() === 'mobile') {
      <button
        type="button"
        class="flex items-center gap-3 p-3 rounded-full text-white bg-green-400 hover:bg-green-600 transition ease-in-out"
        title="Email Signup"
        (click)="onSelectMethod('email')"
      >
        <lucide-angular [img]="Mail"></lucide-angular>
      </button>
      } @else {
      <button
        type="button"
        class="flex items-center gap-3 p-3 rounded-full text-white bg-blue-400 hover:bg-blue-600 transition ease-in-out"
        title="Mobile Signup"
        (click)="onSelectMethod('mobile')"
      >
        <lucide-angular [img]="Phone"></lucide-angular>
      </button>
      }

      <button
        type="button"
        class="flex items-center gap-3 p-3 rounded-full bg-white hover:bg-gray-300 transition ease-in-out"
        title="Google Sign-Up"
        title="Google Sign-Up"
        (click)="onGoogleSignup()"
      >
        <img src="/icons/google.webp" width="24" height="24" alt="Google" />
      </button>
    </div>

    <div class="mt-4 text-center">
      <p>
        Already have an account?
        <a routerLink="/login" class="text-blue-600 hover:underline">Log in</a>
      </p>
    </div>
    }
  </div>
</div>
