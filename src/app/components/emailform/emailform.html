@if(!loading()){ @if( !otpMode()) {
<div class="relative">
  <input
    type="email"
    [formControl]="email"
    placeholder="Email"
    class="w-full p-1 pl-10 border border-gray-300 rounded-3xl focus:ring-2 focus:ring-blue-400 outline-none"
  />
  <lucide-angular [img]="Mail" class="absolute left-2 top-1 text-gray-400 w-5 h-5" />
</div>
<div class="mt-3">
  <div class="relative">
    <!-- Password Input -->
    <input
      [type]="hidePassword ? 'password' : 'text'"
      [formControl]="password"
      placeholder="Password"
      class="w-full p-1 pl-10 pr-10 border border-gray-300 rounded-3xl focus:ring-2 focus:ring-blue-400 outline-none"
    />
    <!-- Left Icon -->
    <lucide-angular [img]="Lock" class="absolute left-2 top-1 text-gray-400 w-5 h-5" />

    <!-- Toggle Visibility Button -->
    <button
      type="button"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
      class="absolute right-2 top-2 text-gray-500 hover:text-gray-700"
      tabindex="-1"
    >
      <lucide-angular [img]="hidePassword ? Eye : EyeOff" class="w-5 h-5" />
    </button>
  </div>
</div>

<div class="mt-1.5 text-right text-sm">
  @if(mode === 'login'){<button
    class="text-gray-800 hover:text-blue-600 hover:underline disabled:hover:line-through disabled:text-red-400"
    [title]="email.valid?'Reset your Password':'Please Enter Email'"
    [disabled]="!email.valid"
    (click)="handlePasswordReset()"
  >
    Forgot password?</button
  >}@else {
  <p>&nbsp;</p>
  }
</div>

<button
  [disabled]="!email.valid || !password.valid"
  (click)="onSubmit()"
  class="w-full mt-5 flex items-center justify-center bg-blue-600 disabled:bg-blue-300 bg-primary-accent hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors shadow-sm"
>
  <lucide-angular [img]="mode === 'signup' ? Send : CheckCircle" class="w-5 h-5 mr-2" />
  {{ mode === 'signup' ? 'Send OTP' : 'Login' }}
</button>
}@else {
<app-otpform (otpSubmit)="onOtpSubmit($event)" (resend)="onOtpResend()"></app-otpform>
} }@else{
<div class="flex flex-col items-center justify-center py-4">
  <lucide-angular [img]="Loader2" class="w-16 h-16 text-blue-600 animate-spin" />
  <p class="mt-4 text-gray-600 text-lg">
    @if(mode==='signup'){ @if(!otpSent()){Sending OTP...} @else{Signing you up...}} @else {Logging
    you in...}
  </p>
</div>
}
