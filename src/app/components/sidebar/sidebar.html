<!-- Mobile Menu Button -->
<button
  class="lg:hidden fixed top-16 -left-2 z-50 px-1 py-3  bg-gray-500/50 text-gray-100 shadow-lg rounded-xl border hover:bg-gray-500 transition"
  (click)="toggle()"
>
  <lucide-angular [img]="Open" />
</button>

@if (isOpen()) {
<div
  class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden"
  (click)="close()"
  animate.leave="backdrop-fade"
></div>
}

<!-- MOBILE SIDEBAR (animated) -->
@if (isOpen()) {
<aside
  class="fixed left-0 top-0 bottom-0 w-72 bg-white z-50 shadow-2xl flex flex-col p-6 gap-6 rounded-r-2xl border-r border-gray-100"
  animate.enter="slide-in"
  animate.leave="slide-out"
>
  <!-- Brand -->
  <div class="flex items-center justify-between">
    <div
      class="text-xl font-semibold text-blue-600 cursor-pointer select-none flex justify-center items-center gap-2"
    >
      <img
        src="/logo.png"
        alt="Home Inventory Logo"
        class="w-12 h-auto"
        draggable="false"
        (contextmenu)="onRightClick()"
      />
      <p class="text-black text-2xl font-bold">ExpiryElf</p>
    </div>
    <button (click)="close()" class="text-gray-600 hover:text-gray-900 p-1">✕</button>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col gap-1">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Main</p>

    <a routerLink="/app/dashboard" routerLinkActive="active" class="nav-item"> 🏠 Dashboard </a>

    <a routerLink="/app/inventory" routerLinkActive="active" class="nav-item"> 📦 Inventory </a>

    <a routerLink="/app/add-item" routerLinkActive="active" class="nav-item"> ➕ Add New Item </a>

    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-4 mb-1">Settings</p>

    <a routerLink="/app/settings" routerLinkActive="active" class="nav-item"> ⚙️ App Settings </a>
  </nav>

  <!-- Footer -->
  <div class="mt-auto text-xs text-gray-400">© 2025 ExpiryElf — All rights reserved.</div>
</aside>
}

<!-- DESKTOP SIDEBAR -->
<aside
  class="hidden lg:flex left-0 top-0 bottom-0 w-72 h-full bg-white shadow-xl p-6 flex-col border-r border-gray-100"
>
  <nav class="flex flex-col gap-1">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Main</p>

    <a routerLink="/app/dashboard" routerLinkActive="active" class="nav-item"> 🏠 Dashboard </a>

    <a routerLink="/app/inventory" routerLinkActive="active" class="nav-item"> 📦 Inventory </a>

    <a routerLink="/app/add-item" routerLinkActive="active" class="nav-item"> ➕ Add New Item </a>

    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-4 mb-1">Settings</p>

    <a routerLink="/app/settings" routerLinkActive="active" class="nav-item"> ⚙️ App Settings </a>
  </nav>

  <div class="mt-auto text-xs text-gray-400">© 2025 ExpiryElf</div>
</aside>
