<div>
  @if(loading()){
  <div class="flex flex-col items-center justify-center py-4">
    <lucide-angular [img]="Loader2" class="w-16 h-16 text-blue-600 animate-spin" />
    <p class="mt-4 text-gray-600 text-lg">@if(!otpSent()){Sending OTP...}@else{Signing In...}</p>
  </div>
  } @else { @if (!otpMode()) {
  <div
    class="flex w-full py-1 border border-gray-300 rounded-md focus-within:border-blue-400 focus-within:shadow-md border-opacity-50"
  >
    <lib-country-list
      (onCountryChange)="onCountryCodeChange($event)"
      selectedCountryCode="IN"
      [selectedCountryConfig]="{ hideName: true, hideCode: true }"
    ></lib-country-list>
    <input
      type="tel"
      [formControl]="mobile"
      placeholder="9876543210"
      class="outline-none w-full ml-1"
    />
  </div>

  <button
    [disabled]="!mobile.valid"
    (click)="sendMobileOtp()"
    class="w-full mt-5 flex items-center justify-center bg-blue-600 disabled:bg-blue-300 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition-colors shadow-sm"
  >
    <lucide-angular [img]="Send" class="w-5 h-5 mr-2" /> Send OTP</button
  >} @else {
  <div class="">
    <app-otpform (otpSubmit)="onOtpSubmit($event)" (resend)="onOtpResend($event)"></app-otpform>
  </div>
  }}
  <div id="recaptcha-container" class="invisible"></div>
</div>
