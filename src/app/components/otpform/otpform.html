<div
  class="flex flex-col items-center justify-center w-full max-w-md mx-auto font-inter bg-transparent"
  [formGroup]="otpForm"
>
  <h2 class="text-2xl font-bold text-gray-800 mb-3">Verify OTP</h2>
  <p class="text-gray-500 mb-5 text-center">
    We've sent a 6-digit code to your email or phone number.
  </p>

  <form (ngSubmit)="submit()" class="flex flex-col gap-6 w-full">
    <div formArrayName="digits" class="flex justify-center gap-3">
      <input
        *ngFor="let ctrl of digits.controls; let i = index"
        type="text"
        maxlength="1"
        [formControlName]="i"
        (input)="onInput($event, i)"
        (keydown)="onKeyDown($event, i)"
        class="w-12 h-14 text-center text-xl font-mono border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 bg-gray-50"
      />
    </div>

    <button
      type="submit"
      [disabled]="otpForm.invalid"
      class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl disabled:bg-blue-300 hover:bg-blue-700 transition-all duration-300 shadow-md"
    >
      Verify Code
    </button>
  </form>

  <p class="mt-5 text-gray-500 text-sm text-center">
    Didn't receive the code?
    <button class="text-blue-600 font-semibold hover:underline ml-1" (click)="resendOtp()">
      Resend OTP
    </button>
  </p>
</div>
